<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Clientes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <style>
        .tabs { margin-bottom: 20px; }
        .tab-link { padding: 8px 12px; margin-right: 4px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; }
        .tab-link.active { background: #ddd; font-weight: bold; }
        .tab-content { border: 1px solid #ccc; padding: 10px; display: none; }
    </style>
</head>
<body>
<nav class="menu">
    <h1 class="logo">Sistema Prime</h1>
    <ul>
        <li><a href="/divulgacao">Divulgação</a></li>
        <li><a href="/consulta">Consultas</a></li>
        <li><a href="/cadastro">Cadastro</a></li>
        <li><a href="/logout">Sair</a></li>
    </ul>
</nav>

<h2>Dashboard Clientes</h2>

<div class="filtros">
    <input type="text" id="filter_saldo" placeholder="Filtrar Saldo Mínimo">
    <input type="text" id="filter_uf" placeholder="Filtrar UF">
    <input type="text" id="filter_orgao" placeholder="Filtrar Órgão">
    <button id="btnAplicarFiltros">Aplicar Filtros</button>
</div>

<div class="info">
    <p><b>Usuário:</b> {{ username }}</p>
    <p>Exibindo <span id="exibidos">0</span> clientes</p>
</div>

<!-- Container das abas e conteúdo -->
<div class="tabs" id="tabs-container"></div>
<div id="clientes-container"></div>

<div style="text-align:center; margin-top: 10px;">
    <button id="btnAtualiza">🔁 Mostrar Próximos 10 Clientes</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const btnAtualiza = document.getElementById('btnAtualiza');
    const btnAplicarFiltros = document.getElementById('btnAplicarFiltros');
    const tabsContainer = document.getElementById('tabs-container');
    const clientesContainer = document.getElementById('clientes-container');
    const exibidosSpan = document.getElementById('exibidos');

    const filtrosSalvos = { saldo: '', uf: '', orgao: '' };
    let currentStart = 0;
    let divulgadores = [];

    // --- Buscar nomes dos divulgadores do servidor ---
    async function carregarDivulgadores() {
        try {
            const res = await fetch('/get_divulgadores');
            divulgadores = await res.json();
        } catch (e) {
            console.error("Erro ao buscar divulgadores:", e);
            divulgadores = [];
        }
    }

    // --- Inicializa divulgadores assim que a página carrega ---
    carregarDivulgadores();

   const camposExibir = [
    "nome",
    "cpf",
    "banco",
    "uf",
    "orgao_nome",      // 👈 adiciona o nome do órgão
    "taxa_orgao",      // 👈 adiciona a taxa do órgão
    "saldo_devedor",
    "parcela",
    "prazo",
    "telefone_movel_1",
    "telefone_movel_2",
    "telefone_movel_3"
];


    btnAplicarFiltros.addEventListener('click', function() {
        filtrosSalvos.saldo = document.getElementById('filter_saldo').value.trim();
        filtrosSalvos.uf = document.getElementById('filter_uf').value.trim();
        filtrosSalvos.orgao = document.getElementById('filter_orgao').value.trim();
        currentStart = 0;
        exibidosSpan.innerText = 0;
        tabsContainer.innerHTML = "";
        clientesContainer.innerHTML = "";
    });

    async function atualizaClientes() {
        btnAtualiza.disabled = true;
        btnAtualiza.innerText = "Carregando...";

        try {
            const res = await fetch('/atualiza_dataframe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    start: currentStart,
                    limit: 10,
                    saldo: filtrosSalvos.saldo,
                    uf: filtrosSalvos.uf,
                    orgao: filtrosSalvos.orgao
                })
            });

            const data = await res.json();
            const clientes = data.clientes || [];

            tabsContainer.innerHTML = "";
            clientesContainer.innerHTML = "";

            clientes.forEach((cliente, index) => {
                const globalIndex = index;

                const tab = document.createElement('button');
                tab.className = 'tab-link';
                tab.innerText = `Cliente ${currentStart + index + 1}`;
                tab.onclick = () => openCliente(globalIndex);
                tabsContainer.appendChild(tab);

                const div = document.createElement('div');
                div.className = 'tab-content';
                div.id = `cliente_${globalIndex}`;
                if(globalIndex !== 0) div.style.display = 'none';

                // --- Dropdown de divulgador ---
                const labelDiv = document.createElement('label');
                labelDiv.innerText = 'Divulgador: ';
                labelDiv.style.display = 'block';
                labelDiv.style.marginBottom = '5px';

                const selectDiv = document.createElement('select');
                selectDiv.name = 'divulgador';
                selectDiv.style.width = '100%';
                selectDiv.style.marginBottom = '10px';

                // Preenche com nomes vindos do servidor
                divulgadores.forEach(nome => {
                    const option = document.createElement('option');
                    option.value = nome;
                    option.innerText = nome;
                    selectDiv.appendChild(option);
                });

                // Define valor atual se já tiver divulgado salvo
                if (cliente.divulgador) {
                    selectDiv.value = cliente.divulgador;
                }

                // Atualiza campo do cliente ao alterar
                selectDiv.addEventListener('change', () => {
                    cliente.divulgador = selectDiv.value;
                });

                labelDiv.appendChild(selectDiv);
                div.appendChild(labelDiv);

                // --- Botão salvar ---
                const btnSalvar = document.createElement('button');
                btnSalvar.innerText = 'Salvar Cliente';
                btnSalvar.style.float = 'right';
                btnSalvar.style.marginBottom = '10px';
                btnSalvar.onclick = () => salvarCliente(cliente);
                div.appendChild(btnSalvar);

                camposExibir.forEach(key => {
              if (cliente[key] !== null && cliente[key] !== undefined) {
                  const p = document.createElement('p');

                  // Se o campo for de telefone, adiciona botão de copiar
                  if (key.toLowerCase().includes('telefone')) {
                      p.innerHTML = `
                          <b>${key}:</b>
                          <span class="telefone">${cliente[key]}</span>
                          <button class="btn-copiar" onclick="copiarTelefone(this)">📋</button>
                      `;
                                    } else {
                        if (key === "taxa_orgao") {
                            p.innerHTML = `<b>Taxa do Órgão:</b> ${cliente[key] ? cliente[key].toFixed(2) + "%" : "—"}`;
                        } else if (key === "orgao_nome") {
                            p.innerHTML = `<b>Órgão:</b> ${cliente[key] || "—"}`;
                        } else {
                            p.innerHTML = `<b>${key}:</b> ${cliente[key]}`;
                        }
                    }


                  div.appendChild(p);
              }
          });


                        // --- Campo para novo número de telefone ---
                        const labelNovoTel = document.createElement('label');
                        labelNovoTel.innerText = 'Novo número de telefone:';
                        labelNovoTel.style.display = 'block';
                        labelNovoTel.style.marginTop = '10px';

                        const inputNovoTel = document.createElement('input');
                        inputNovoTel.type = 'text';
                        inputNovoTel.placeholder = '(DDD) 9XXXX-XXXX';
                        inputNovoTel.style.width = '100%';
                        inputNovoTel.style.marginBottom = '8px';

                        // Validação simples (somente números e mínimo de 10 dígitos)
                        inputNovoTel.addEventListener('input', () => {
                            inputNovoTel.value = inputNovoTel.value.replace(/\D/g, ''); // remove letras/símbolos
                        });

                        div.appendChild(labelNovoTel);
                        div.appendChild(inputNovoTel);

                        // Quando clicar em salvar, envia junto o novo número
                        btnSalvar.onclick = () => {
                            const novoNumero = inputNovoTel.value.trim();
                            if (novoNumero && !/^\d{10,11}$/.test(novoNumero)) {
                                alert('❌ Formato de número inválido! Use DDD + número, apenas dígitos.');
                                return;
                            }
                            if (novoNumero) {
                                cliente.novo_telefone = novoNumero; // adiciona campo novo
                            }
                            salvarCliente(cliente);
                        };


                clientesContainer.appendChild(div);
            });

            exibidosSpan.innerText = clientes.length;
            if(clientes.length > 0) openCliente(0);
            currentStart += clientes.length;
            if(currentStart >= data.total_count || clientes.length === 0) currentStart = 0;

        } catch(e) {
            console.error('Erro ao atualizar clientes:', e);
        } finally {
            btnAtualiza.disabled = false;
            btnAtualiza.innerText = "🔁 Mostrar Próximos 10 Clientes";
        }
    }

    btnAtualiza.addEventListener('click', atualizaClientes);

    function openCliente(index) {
        const tabs = document.querySelectorAll('.tab-link');
        const contents = document.querySelectorAll('.tab-content');
        tabs.forEach((t,i) => t.classList.toggle('active', i === index));
        contents.forEach((c,i) => c.style.display = (i === index ? 'block' : 'none'));
    }

    async function salvarCliente(cliente) {
        try {
            const res = await fetch('/salvar_cliente', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cliente)
            });

            const data = await res.json();
            if (data.status === 'ok') {
                alert('✅ Cliente salvo com sucesso!');
            } else {
                alert('⚠️ Erro ao salvar cliente: ' + (data.mensagem || 'desconhecido'));
            }

        } catch (err) {
            console.error('Falha na conexão:', err);
            alert('❌ Falha de conexão ou erro inesperado.');
        }
    }
});
</script>

<script>
function copiarTelefone(botao) {
  const telefone = botao.parentElement.querySelector('.telefone').textContent.trim();
  navigator.clipboard.writeText(telefone)
    .then(() => {
      botao.textContent = '✅';
      setTimeout(() => botao.textContent = '📋', 1000);
    })
    .catch(() => alert('❌ Não foi possível copiar o número.'));
}
</script>



</body>
</html>
