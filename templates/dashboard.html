<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta name="csrf-token" content="{{ csrf_token() }}">

<meta charset="UTF-8">
<title>Dashboard Clientes</title>

<!-- CSS seguro -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>
<nav class="menu">
    <h1 class="logo">Sistema Prime</h1>
    <ul>
        <li><a href="{{ url_for('dashboard.consulta') }}">Consultas</a></li>
        <li><a href="{{ url_for('auth.logout') }}">Sair</a></li>
    </ul>
</nav>

<h2>Divulgação</h2>

<div class="filtros">
    <input type="text" id="filter_saldo" placeholder="Filtrar Saldo Mínimo">
    <input type="text" id="filter_uf" placeholder="Filtrar UF">
    <input type="text" id="filter_orgao" placeholder="Filtrar Órgão">
    <button id="btnAplicarFiltros">Aplicar Filtros</button>
</div>

<div class="info">
    <p><b>Usuário:</b> {{ username }}</p>
    <p>Exibindo <span id="exibidos">{{ exibidos }}</span> clientes</p>
</div>

<div class="tabs" id="tabs-container"></div>
<div id="clientes-container"></div>

<div class="centralizado">
   <center> <button id="btnAtualiza">Mostrar Próximos 10 Clientes</button></center>
</div>

<!-- JS externo seguro -->
<script nonce="{{ g.csp_nonce }}">
// Captura do token CSRF para AJAX
const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

// Exemplo de função AJAX para atualizar clientes (adaptar conforme dashboard.js)
async function atualizaClientes(data) {
    const response = await fetch("{{ url_for('dashboard.atualiza_dataframe') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body: JSON.stringify(data)
    });
    return await response.json();
}
</script>

<script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
