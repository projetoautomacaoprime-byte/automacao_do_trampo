<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Consulta — Fluxo Pessoas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS externo permitido na CSP -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f2ec;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  
  .container {
    width: 100%;
    max-width: 900px;
    height: 95vh;
    margin: 0 auto;
    box-sizing: border-box;
    padding: 20px;
    overflow: hidden; 
  }
    
  #clientes-container {
    max-height: calc(95vh - 220px);
    overflow-y: auto;
  }

  #clientes-container::-webkit-scrollbar-thumb {
    background: #d4a62a;
    border-radius: 10px;
  }
/* Caixa de busca */
  .search-box {
    background: #3e4750;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    padding: 25px 20px;
    text-align: center;
    margin-bottom: 20px;
  }

  .search-box h2 {
    color: #000;
    margin-bottom: 15px;
  }

  .search-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .search-row input {
    flex: 1;
    min-width: 220px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d4a62a;
    font-size: 15px;
  }

  .search-row select {
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
  }

  .search-row button {
    background: linear-gradient(135deg, #d4a62a, #b88914);
    border: none;
    padding: 10px 24px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    color: #000;
  }

/* Área de resultados com scroll */
  #clientes-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 15px;
    max-height: 65vh;
    overflow-y: auto;
    padding-right: 4px;
  }

  #clientes-container::-webkit-scrollbar {
    width: 6px;
  }

  #clientes-container::-webkit-scrollbar-thumb {
    background: #c9a227;
    border-radius: 10px; 
  }

/* Cards */
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    font-size: 14px; 
  }

  .card p {
    margin: 3px 0;
    text-align: center;
  }

  .card strong {
    color: #000;
  }

  .btn-editar, .btn-salvar {
    background: #1e40af;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 22px;
    font-weight: bold;
    cursor: pointer;
  }

  .btn-load {
    background: #1e40af;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 15px;
  }

  </style>
</head>

<body>
<div class="container">
  <h2>Consulta de Pessoas</h2>

  <div class="search-row">
    <input type="text" id="busca_geral" placeholder="Pesquisar por nome, CPF, telefone, e-mail, órgão, banco...">

    <select id="filtro_divulgador">
      <option value="">Todos os divulgadores</option>
      <option value="{{ username | e }}">Meus divulgados</option>
    </select>

    <button id="btnPesquisar">Buscar</button>
  </div>

  <div id="clientes-container"></div>
  <div style="text-align:center;">
    <button id="btnCarregarMais" class="btn-load" style="display:none;">Carregar mais</button>
  </div>
</div>

<!-- SCRIPT SEGURO COM NONCE -->
<script nonce="{{ g.csp_nonce }}">
const CSRF_TOKEN = "{{ csrf_token() }}";

// ======================================================
// 🔒 SAFE FETCH
// ======================================================
async function safeFetch(url, options = {}) {
  options.headers = options.headers || {};
  options.headers["X-CSRFToken"] = CSRF_TOKEN;

  let response;
  try {
    response = await fetch(url, options);
  } catch {
    throw new Error("erro_fetch");
  }
  return response;
}

// ======================================================
// 🔒 CARD SEGURO (SEM innerHTML MALICIOSO)
// ======================================================
function criarSpan(label, valor) {
  const p = document.createElement("p");
  const b = document.createElement("strong");
  b.textContent = label + ": ";
  const span = document.createElement("span");
  span.dataset.field = label.toLowerCase();
  span.textContent = valor || "-";
  p.appendChild(b);
  p.appendChild(span);
  return p;
}

function renderizarCard(c) {
  const div = document.createElement("div");
  div.classList.add("card");
  div.id = "card-" + c.doc_id;
  div.dataset.id = c.doc_id;

  const campos = {
    Nome: c.nome,
    CPF: c.cpf,
    Idade: c.idade,
    Órgão: c.orgao_nome,
    UF: c.uf,
    Banco: c.banco,
    "Telefone 1": c.telefone_movel_1,
    "Telefone 2": c.telefone_movel_2,
    "Telefone 3": c.telefone_movel_3,
    Divulgador: c.divulgador,
    "Data Divulgação": c.data_divulgacao
  };

  for (const [label, valor] of Object.entries(campos)) {
    const p = document.createElement("p");
    const b = document.createElement("strong");
    b.textContent = label + ": ";
    const span = document.createElement("span");
    span.dataset.field = label.toLowerCase().replace(" ", "_");
    span.textContent = valor || "-";
    p.appendChild(b);
    p.appendChild(span);
    div.appendChild(p);
  }

  const btnArea = document.createElement("div");
  btnArea.style.marginTop = "10px";

  const btnEditar = document.createElement("button");
  btnEditar.classList.add("btn-editar");
  btnEditar.textContent = "Editar";

  const btnSalvar = document.createElement("button");
  btnSalvar.classList.add("btn-salvar");
  btnSalvar.textContent = "Salvar";
  btnSalvar.style.display = "none";

  btnArea.appendChild(btnEditar);
  btnArea.appendChild(btnSalvar);
  div.appendChild(btnArea);

  // add listeners SEM inline
  btnEditar.addEventListener("click", () => editarCliente(c.doc_id, btnEditar, btnSalvar));
  btnSalvar.addEventListener("click", () => salvarCliente(c.doc_id, btnEditar, btnSalvar));

  return div;
}

// ======================================================
// 🔍 BUSCA (SEGURO)
// ======================================================
document.addEventListener("DOMContentLoaded", () => {
  const inputBusca = document.getElementById("busca_geral");
  const filtroDivulgador = document.getElementById("filtro_divulgador");
  const btnPesquisar = document.getElementById("btnPesquisar");
  const btnCarregarMais = document.getElementById("btnCarregarMais");
  const clientesContainer = document.getElementById("clientes-container");

  let termoAtual = "";
  let lastDocId = null;
  let carregando = false;

  async function buscar(reset = false) {
    if (carregando) return;
    carregando = true;

    if (reset) {
      clientesContainer.innerHTML = "";
      lastDocId = null;
    }

    const payload = {
      q: termoAtual,
      last_id: lastDocId,
      limit: 20,
      divulgador: filtroDivulgador.value || null
    };

    try {
      const res = await safeFetch("/buscar_fluxo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      const clientes = data.clientes || [];

      if (clientes.length === 0 && reset) {
        clientesContainer.innerHTML = "<p>Nenhum resultado encontrado.</p>";
        btnCarregarMais.style.display = "none";
      } else {
        clientes.forEach(c => clientesContainer.appendChild(renderizarCard(c)));
        lastDocId = clientes.at(-1)?.doc_id || null;
        btnCarregarMais.style.display = clientes.length < 20 ? "none" : "inline-block";
      }

    } catch {
      alert("❌ Erro na busca");
    }

    carregando = false;
  }

  btnPesquisar.addEventListener("click", () => {
    termoAtual = inputBusca.value.trim();
    buscar(true);
  });

  inputBusca.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      termoAtual = inputBusca.value.trim();
      buscar(true);
    }
  });

  btnCarregarMais.addEventListener("click", () => buscar(false));
});

// ======================================================
// ✏ EDITAR / SALVAR (SEGURO)
// ======================================================
function editarCliente(id, btnEditar, btnSalvar) {
  const card = document.getElementById("card-" + id);
  const spans = card.querySelectorAll("span[data-field]");

  spans.forEach(span => {
    const value = span.textContent === "-" ? "" : span.textContent;
    const input = document.createElement("input");
    input.dataset.field = span.dataset.field;
    input.value = value;
    span.replaceWith(input);
  });

  btnEditar.style.display = "none";
  btnSalvar.style.display = "inline-block";
}

async function salvarCliente(id, btnEditar, btnSalvar) {
  const card = document.getElementById("card-" + id);
  const inputs = card.querySelectorAll("input[data-field]");
  const body = {};

  inputs.forEach(inp => body[inp.dataset.field] = inp.value.trim());

  try {
    const res = await safeFetch(`/atualizar_fluxo/${id}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (!res.ok || !data || data.status !== "ok") throw new Error("erro");

    inputs.forEach(inp => {
      const span = document.createElement("span");
      span.dataset.field = inp.dataset.field;
      span.textContent = inp.value || "-";
      inp.replaceWith(span);
    });

    btnSalvar.style.display = "none";
    btnEditar.style.display = "inline-block";

    alert("✔ Salvo!");

  } catch {
    alert("❌ Erro ao salvar");
  }
}
</script>
</body>
</html>
