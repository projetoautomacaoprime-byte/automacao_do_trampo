<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Consulta — Fluxo Pessoas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #fafafa; }
    .container { max-width: 900px; margin: 0 auto; }
    .search-row { display: flex; gap: 8px; margin-bottom: 15px; }
    .search-row input { flex: 1; padding: 8px; font-size: 16px; }
    .search-row button { padding: 8px 14px; cursor: pointer; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .card p { margin: 4px 0; }
    .btn-load { background: #007bff; color: white; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
    .btn-load:disabled { background: #ccc; cursor: default; }
  </style>
</head>
<body>
<div class="container">
  <h2>🔍 Consulta de Pessoas</h2>

  <div class="search-row">
    <input type="text" id="busca_geral" placeholder="Pesquisar por nome, CPF, telefone, e-mail, órgão, banco...">
    <select id="filtro_divulgador">
      <option value="">Todos os divulgadores</option>
      <option value="{{ username }}">Meus divulgados</option>
    </select>
    <button id="btnPesquisar">Buscar</button>
  </div>

  <div id="clientes-container"></div>
  <div style="text-align:center;">
    <button id="btnCarregarMais" class="btn-load" style="display:none;">Carregar mais</button>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// 🔥 FUNÇÃO GLOBAL DE FETCH COM ERROS IMEDIATOS
// ---------------------------------------------------------------------------
async function safeFetch(url, options = {}) {
  if (!navigator.onLine) {
    throw new Error("offline");
  }

  let response;
  try {
    response = await fetch(url, options);
  } catch (e) {
    throw new Error("servidor_off");
  }

  return response;
}

// ---------------------------------------------------------------------------
// 🔥 RENDERIZA UM CARD COMPLETO
// ---------------------------------------------------------------------------
function renderizarCard(c) {
  const div = document.createElement('div');
  div.classList.add('card');
  div.id = "card-" + c.doc_id;
  div.setAttribute("data-id", c.doc_id);

  div.innerHTML = `
    <p><strong>Nome:</strong> <span data-field="nome">${c.nome || '-'}</span></p>
    <p><strong>CPF:</strong> <span data-field="cpf">${c.cpf || '-'}</span></p>
    <p><strong>Idade:</strong> <span data-field="idade">${c.idade || '-'}</span></p>
    <p><strong>Órgão:</strong> <span data-field="orgao_nome">${c.orgao_nome || '-'}</span></p>
    <p><strong>UF:</strong> <span data-field="uf">${c.uf || '-'}</span></p>
    <p><strong>Banco:</strong> <span data-field="banco">${c.banco || '-'}</span></p>
    <p><strong>Telefone 1:</strong> <span data-field="telefone_movel_1">${c.telefone_movel_1 || '-'}</span></p>
    <p><strong>Telefone 2:</strong> <span data-field="telefone_movel_2">${c.telefone_movel_2 || '-'}</span></p>
    <p><strong>Telefone 3:</strong> <span data-field="telefone_movel_3">${c.telefone_movel_3 || '-'}</span></p>
    <p><strong>Divulgador:</strong> <span data-field="divulgador">${c.divulgador || '-'}</span></p>
    <p><strong>Data da Divulgação:</strong> <span data-field="data_divulgacao">${c.data_divulgacao || '-'}</span></p>

    <div style="margin-top:10px;">
        <button class="btn-editar" onclick="editarCliente('${c.doc_id}', this)">Editar</button>
        <button class="btn-salvar" onclick="salvarCliente('${c.doc_id}', this)" style="display:none;">Salvar</button>
    </div>
  `;

  return div;
}

// ---------------------------------------------------------------------------
// 🔥 BUSCAR FLUXO
// ---------------------------------------------------------------------------
document.addEventListener('DOMContentLoaded', () => {
  const inputBusca = document.getElementById('busca_geral');
  const btnPesquisar = document.getElementById('btnPesquisar');
  const btnCarregarMais = document.getElementById('btnCarregarMais');
  const clientesContainer = document.getElementById('clientes-container');
  const filtroDivulgador = document.getElementById('filtro_divulgador');

  let termoAtual = '';
  let lastDocId = null;
  let carregando = false;

  async function buscarFluxo(reset = false) {
    if (carregando) return;
    carregando = true;

    if (reset) {
      clientesContainer.innerHTML = '';
      lastDocId = null;
    }

    const payload = {
      q: termoAtual,
      last_id: lastDocId,
      limit: 20,
      divulgador: filtroDivulgador.value || null
    };

    try {
      const res = await safeFetch('/buscar_fluxo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      const clientes = data.clientes || [];

      if (clientes.length === 0 && reset) {
        clientesContainer.innerHTML = '<p>Nenhum resultado encontrado.</p>';
        btnCarregarMais.style.display = 'none';
      } else {
        clientes.forEach(c => {
          clientesContainer.appendChild(renderizarCard(c));
        });

        lastDocId = clientes[clientes.length - 1]?.doc_id || null;

        btnCarregarMais.style.display = clientes.length < 20 ? 'none' : 'inline-block';
      }

    } catch (err) {
      if (err.message === "offline") {
        alert("❌ Sem internet! Conecte-se e tente novamente.");
      } else {
        alert("❌ Erro ao buscar dados! Servidor indisponível.");
      }
    }

    carregando = false;
  }

  // EVENTOS
  btnPesquisar.addEventListener('click', () => {
    termoAtual = inputBusca.value.trim();
    buscarFluxo(true);
  });

  inputBusca.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      termoAtual = inputBusca.value.trim();
      buscarFluxo(true);
    }
  });

  btnCarregarMais.addEventListener('click', () => {
    buscarFluxo(false);
  });
});

// ---------------------------------------------------------------------------
// 🔥 EDITAR CLIENTE
// ---------------------------------------------------------------------------
function editarCliente(id, btnEditar) {
  const card = document.getElementById("card-" + id);
  const spans = card.querySelectorAll("span[data-field]");

  spans.forEach(span => {
    const valor = span.innerText === "-" ? "" : span.innerText;
    span.outerHTML = `<input data-field="${span.dataset.field}" value="${valor}">`;
  });

  btnEditar.style.display = "none";
  btnEditar.nextElementSibling.style.display = "inline-block";
}

// ---------------------------------------------------------------------------
// 🔥 SALVAR CLIENTE COM ERROS IMEDIATOS
// ---------------------------------------------------------------------------
async function salvarCliente(id, btnSalvar) {
  const card = document.getElementById("card-" + id);
  const realId = id || card.getAttribute("data-id");

  if (!realId) {
    alert("Erro: ID não encontrado!");
    return;
  }

  const inputs = card.querySelectorAll("input[data-field]");
  let body = {};
  inputs.forEach(inp => body[inp.dataset.field] = inp.value.trim());

  try {
    const response = await safeFetch(`/atualizar_fluxo/${realId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await response.json().catch(() => null);

    if (!response.ok || !data || data.status !== "ok") {
      throw new Error("erro_salvar");
    }

    // Transformar inputs em spans
    inputs.forEach(inp => {
      inp.outerHTML = `<span data-field="${inp.dataset.field}">${inp.value || '-'}</span>`;
    });

    btnSalvar.style.display = "none";
    btnSalvar.previousElementSibling.style.display = "inline-block";

    alert("Salvo com sucesso!");

  } catch (err) {
    if (err.message === "offline") {
      alert("❌ Sem internet! Não foi possível salvar.");
    } else if (err.message === "servidor_off") {
      alert("❌ Servidor indisponível! Tente novamente mais tarde.");
    } else {
      alert("❌ Erro ao salvar! Tente novamente.");
    }
  }
}
</script>
</body>
</html>
