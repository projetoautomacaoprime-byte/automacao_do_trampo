<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <title>Consulta — Fluxo Pessoas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        /* estilos mínimos para visualização rápida */
        .container { max-width: 1000px; margin: 30px auto; padding: 16px; }
        .search-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
        .search-row input { flex:1; padding:8px 10px; font-size:16px; }
        .search-row button { padding:8px 12px; font-size:16px; cursor:pointer; }
        .result-list { margin-top:16px; }
        .card { padding:10px; border:1px solid #ddd; border-radius:6px; margin-bottom:8px; }
        .muted { color:#666; font-size:13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Consulta de Clientes</h1>
        <p class="muted">Usuário: {{ username or '—' }}</p>

        <div class="search-row">
            <input id="search-input" type="text" placeholder="Pesquisar por nome, CPF, doc_id..." />
            <button id="search-btn" type="button">Pesquisar</button>
        </div>

        <div id="results" class="result-list">
            <!-- resultados aparecerão aqui -->
            <p class="muted">Nenhuma busca realizada ainda.</p>
        </div>
    </div>

    <!-- Placeholder JS: futuro AJAX para buscar no Firestore via /consulta (POST) ou endpoint dedicado -->
    <script>
        // Por enquanto só previne reload e mostra texto (implementaremos busca depois)
        document.getElementById('search-btn').addEventListener('click', function() {
            const termo = document.getElementById('search-input').value.trim();
            const results = document.getElementById('results');
            if (!termo) {
                results.innerHTML = '<p class="muted">Digite um termo para pesquisar (nome, CPF ou doc_id).</p>';
                return;
            }
            results.innerHTML = '<p class="muted">Buscando — ainda não implementado. Em breve eu crio o endpoint que retorna resultados.</p>';
        });
    </script>
</body>
</html>
